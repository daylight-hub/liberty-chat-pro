name: Build Liberty Chat Pro APK

on:
  push:
    branches: [ main, liberty-chat-pro ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # Hoisted to job level: the `secrets` context is not available in a step's
    # `if`, but `env` is - and job-level env is resolved before steps evaluate.
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # p4a is not reliable on 3.13 yet

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The SDK/NDK download is the slow part. Caching it turns a 45-60 minute
      # first build into roughly 10 minutes on subsequent runs.
      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v2-${{ hashFiles('sbapp/buildozer.spec') }}
          restore-keys: buildozer-global-v2-

      - name: Cache buildozer build directory
        uses: actions/cache@v4
        with:
          path: sbapp/.buildozer
          key: buildozer-local-v2-${{ hashFiles('sbapp/buildozer.spec') }}-${{ github.sha }}
          restore-keys: |
            buildozer-local-v2-${{ hashFiles('sbapp/buildozer.spec') }}-
            buildozer-local-v2-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool libtool-bin libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev \
            patchelf m4 ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer 'cython>=3.1,<3.2' virtualenv rich

      - name: Accept Android SDK licences
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # p4a clone cleanup stays here (confirmed working - p4a is correctly
      # pinned to v2026.05.09 in every run). Recipe-build cleanup for
      # hostpython3/python3/numpy moved into ci/build-android.sh itself,
      # since a prior version of this step appeared not to take effect and
      # the in-script version can verify its own result before continuing.
      - name: Clean p4a clone
        run: |
          rm -rf sbapp/.buildozer/android/platform/python-for-android || true

      - name: Build APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          bash ci/build-android.sh "$BUILD_TYPE"

      # Always upload logs, pass or fail - buildozer's own error tail is
      # useless, and the real failure is usually deep in the p4a output.
      - name: Collect build logs
        if: always()
        run: |
          mkdir -p build-logs
          find sbapp/.buildozer -name "*.log" -newermt '-60 minutes' \
            -exec cp --parents {} build-logs/ \; 2>/dev/null || true
          # p4a writes recipe build output here
          for d in sbapp/.buildozer/android/platform/build-*/build/other_builds; do
            [ -d "$d" ] && find "$d" -name "config.log" -exec cp --parents {} build-logs/ \; 2>/dev/null || true
          done
          du -sh build-logs || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-logs/**
            sbapp/.buildozer/**/*.log
          retention-days: 7
          if-no-files-found: warn

      - name: Locate artifact
        id: apk
        working-directory: sbapp
        run: |
          APK=$(find bin -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          echo "path=sbapp/$APK" >> $GITHUB_OUTPUT
          echo "name=$(basename $APK)" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      # Signing only runs when the secrets exist, so forks and PRs still build.
      - name: Sign release APK
        if: ${{ github.event.inputs.build_type == 'release' && env.KEYSTORE_B64 != '' }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore

          # buildozer installs its own SDK; ANDROID_HOME may be unset or point elsewhere.
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          [ -d "$SDK_ROOT/build-tools" ] || SDK_ROOT="$ANDROID_HOME"
          BUILD_TOOLS=$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BUILD_TOOLS" ]; then
            echo "Could not locate Android build-tools; searched $SDK_ROOT"
            exit 1
          fi
          echo "Using build-tools: $BUILD_TOOLS"

          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "sbapp/bin/LibertyChatPro-signed.apk" \
            "${{ steps.apk.outputs.path }}"

          "$BUILD_TOOLS/apksigner" verify --print-certs "sbapp/bin/LibertyChatPro-signed.apk"
          rm -f /tmp/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: liberty-chat-pro-apk
          path: sbapp/bin/*.apk
          retention-days: 30

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          # Always create/update a draft release so every successful build
          # produces downloadable APKs. Publish manually when ready.
          draft: true
          prerelease: ${{ github.event.inputs.build_type != 'release' }}
          name: "Liberty Chat Pro ${{ github.ref_name }} (${{ github.event.inputs.build_type || 'debug' }})"
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || format('build-{0}', github.run_number) }}
          body: |
            ## Liberty Chat Pro — automated build

            **Branch:** `${{ github.ref_name }}`
            **Build:** ${{ github.run_number }} (`${{ github.sha }}`)
            **Type:** ${{ github.event.inputs.build_type || 'debug' }}

            ### Files
            | File | Description |
            |---|---|
            | `*-debug.apk` | Debug build — install directly for testing |
            | `LibertyChatPro-signed.apk` | Signed release build (if release build was selected) |

            ### Install
            1. Download the APK below
            2. Enable **Install unknown apps** for your file manager or browser
            3. Open the APK to install

            > Liberty Chat Pro installs **alongside** stock Sideband — different package ID.
          files: |
            sbapp/bin/*.apk
          fail_on_unmatched_files: false
